<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>課外活動｜江俊諺學習歷程</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #4CAF50, #2E8B57);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 40px;
            margin: 0 0 10px;
        }

        header p {
            font-size: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .intro {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 35px;
        }

        .intro h2 {
            color: #2E8B57;
        }

        .intro p {
            line-height: 1.9;
            font-size: 17px;
        }

        .photo-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 35px;
            text-align: center;
        }

        .photo-box img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
        }

        .photo-box p {
            color: #666;
            margin-bottom: 0;
        }

        .back-button {
            text-align: center;
            margin: 40px 0;
        }

        .back-button a {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-button a:hover {
            background: #2E8B57;
            transform: translateY(-3px);
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 30px;
            }

            .container {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌟 課外活動</h1>
    <p>拓展視野，累積多元學習與團隊合作經驗</p>
</header>

<div class="container">

    <div class="intro">

        <h2>我的課外活動</h2>

        <p>
            高中三年除了課業學習之外，我也積極參與學校的各項課外活動。
            透過參與不同活動，我有機會與同學合作，也能學習課本以外的知識。
        </p>

        <p>
            在活動過程中，我學習到如何與他人溝通、分配工作以及解決問題。
            這些經驗讓我了解到團隊合作的重要性，也讓我的高中生活更加充實。
        </p>

    </div>

    <div class="photo-box">

        <img src="images/activity.jpg" alt="課外活動照片">

        <p>
            課外活動紀錄
        </p>

    </div>

    <div class="intro">

        <h2>活動帶給我的收穫</h2>

        <p>
            透過課外活動，我培養了責任感、溝通能力與團隊合作能力。
            當遇到問題時，也學會先思考解決方法，而不是直接放棄。
        </p>

        <p>
            我認為這些經驗對未來的大學生活也會有很大的幫助。
        </p>

    </div>

    <div class="back-button">

        <a href="index.html">
            ← 回到首頁
        </a>

    </div>

</div>

<footer>
    <p>© 2026 江俊諺｜高中生學習歷程檔案</p>
</footer>

</body>

</html>
